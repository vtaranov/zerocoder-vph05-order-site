server {
    listen 8080;
    server_name localhost;
    location = /health { access_log off; return 200 'ok\n'; }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 32k;
    location = /docs {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 7d;
    }
    location = /favicon.svg { root /usr/share/nginx/html; }
    location = / { root /usr/share/nginx/html; try_files /index.html =404; add_header Cache-Control "no-cache"; }
    location = /pgadmin { return 308 /pgadmin/; }
    location /pgadmin/ {
        set $pgadmin http://pgadmin:80;
        proxy_pass $pgadmin;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port ${HTTPS_PORT};
        proxy_set_header X-Script-Name /pgadmin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        client_max_body_size 10m;
    }
    location /v2/ {
        set $registry http://registry:5000;
        proxy_pass $registry;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 0;
    }
    location / { return 404; }
}
